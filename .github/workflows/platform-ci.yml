name: platform-ci

on:
  push:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: platform

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The web build only needs a public site URL (see apps/web/.env.example).
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run build --workspace @platform/shared
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:i18n
      - run: npm run build:api
      - run: npm run build
      - name: Regenerate API client and fail if stale
        run: |
          npm run gen:api-client
          git diff --exit-code -- packages/api-client

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply migrations
        run: scripts/db-apply.sh
      - name: Re-apply migrations (must be a no-op)
        run: scripts/db-apply.sh
      - name: Run SQL tests
        run: scripts/db-test.sh
