name: platform-ci

on:
  push:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: platform

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The web build only needs a public site URL (see apps/web/.env.example).
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run build --workspace @platform/shared
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:i18n
      - run: npm run build:api
      - run: npm run build
      - name: Regenerate API client and fail if stale
        run: |
          npm run gen:api-client
          git diff --exit-code -- packages/api-client

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Apply migrations
        run: supabase db reset
      - name: Run RLS and fulfillment SQL tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/rls_and_fulfillment.sql
