name: platform-ci

on:
  push:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: platform

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The web build only needs a public site URL (see apps/web/.env.example).
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run build --workspace @platform/shared
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:i18n
      - run: npm run build:api
      - run: npm run build
      - name: Regenerate API client and fail if stale
        run: |
          npm run gen:api-client
          git diff --exit-code -- packages/api-client

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply migrations
        run: scripts/db-apply.sh
      - name: Re-apply migrations (must be a no-op)
        run: scripts/db-apply.sh
      - name: Run SQL tests
        run: scripts/db-test.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://app_api:test_api_password@127.0.0.1:5432/postgres
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_BASE_URL: http://localhost:3001
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      COMMERCE_MODE: api
      GUEST_MODE: api
      NODE_ENV: test
      E2E_CAPTURE_EMAILS: 1
      WEB_ORIGINS: http://localhost:3000
      BETTER_AUTH_SECRET: test-better-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3001
      AUTH_COOKIE_DOMAIN: ''
      IP_HASH_SECRET: test-ip-hash-secret-at-least-32-chars
      PAYMENTS_PROVIDER: manual
      PAYMENTS_MOCK_SECRET: test-payments-mock-secret-at-least-32-chars
      MANUAL_PAYMENT_INSTRUCTIONS_JSON: '{"methods":[{"id":"instapay","label":{"ar":"إنستاباي","en":"InstaPay"},"details":{"ar":"user@instapay","en":"user@instapay"}}]}'
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: test
      SMTP_PASS: test
      SMTP_FROM: noreply@example.com
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply migrations
        run: scripts/db-apply.sh
      - name: Set app_api password
        run: |
          psql "$DATABASE_URL_ADMIN" -c "ALTER ROLE app_api WITH PASSWORD 'test_api_password';"
      - name: Ensure live template is seeded
        run: |
          psql "$DATABASE_URL_ADMIN" -c "UPDATE public.templates SET status = 'live', license_complete = true WHERE slug = 'mashrabiya';"
      - name: Build shared, api, and web
        run: |
          npm run build --workspace @platform/shared
          npm run build --workspace @platform/api
          npm run build --workspace @platform/web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start API and Web servers
        run: |
          PORT=3001 node apps/api/dist/main.js > api.log 2>&1 &
          PORT=3000 npm run start --workspace @platform/web -- -p 3000 > web.log 2>&1 &
      - name: Wait for API and Web health
        run: |
          echo "Waiting for API health..."
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:3001/v1/health > /dev/null 2>&1; then
              echo "API is healthy on attempt $i!"
              break
            fi
            sleep 1
          done
          if ! curl -sSf http://localhost:3001/v1/health; then
            echo "API failed to boot. Log output:"
            cat api.log
            exit 1
          fi

          echo "Waiting for Web health..."
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Web is healthy on attempt $i!"
              break
            fi
            sleep 1
          done
          if ! curl -sSf http://localhost:3000/api/health; then
            echo "Web failed to boot. Log output:"
            cat web.log
            exit 1
          fi
      - name: Run Playwright smoke test
        run: npm run test:e2e
      - name: Upload Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            platform/e2e/playwright-report/
            platform/e2e/test-results/
            platform/api.log
            platform/web.log
          retention-days: 7

