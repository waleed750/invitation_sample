<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="crescentGlow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFF4D0" stop-opacity="1" />
      <stop offset="65%" stop-color="#E3A740" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#C46A55" stop-opacity="0.7" />
    </radialGradient>
    <filter id="moonHalo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luminous halo -->
  <circle cx="50" cy="50" r="42" fill="#E3A740" fill-opacity="0.08" />
  <circle cx="50" cy="50" r="36" fill="#E3A740" fill-opacity="0.12" />

  <!-- Crescent Body -->
  <path d="M 50 14 A 36 36 0 1 0 50 86 A 31 31 0 1 1 50 14 Z" fill="url(#crescentGlow)" filter="url(#moonHalo)" />

  <!-- Subtle star companion nestled in the crescent cradle -->
